services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - taskman-mongo:/data/db

  # Postgres target for the Mongo->Postgres migration
  # (docs/DESIGN_PG_FSM_MIGRATION.md). Not wired into `make up` yet — bring
  # it up explicitly with `make pg` once a wave needs it running.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - taskman-pgdata:/var/lib/postgresql/data

volumes:
  taskman-mongo:
  taskman-pgdata:
