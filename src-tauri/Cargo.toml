[package]
name = "taskman"
version = "0.1.0"
description = "taskman desktop shell (thin client over the taskman Go server)"
edition = "2021"
rust-version = "1.77"

# Desktop-only thin client (macOS). No mobile targets, so a plain binary
# crate is enough — no cdylib/staticlib lib target needed.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
